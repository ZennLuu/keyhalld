name: KiCad ERC and DRC

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Schematic ERC and PCB DRC
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out project
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install KiCad 10
        id: install
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            kicad kicad-symbols kicad-footprints kicad-packages3d
          kicad-cli version

          # Initialize standard libraries without opening the KiCad GUI.
          mkdir -p "$HOME/.config/kicad/10.0" reports
          cp /usr/share/kicad/template/sym-lib-table "$HOME/.config/kicad/10.0/sym-lib-table"
          cp /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/10.0/fp-lib-table"

      - name: Check schematic (ERC) Main
        # Run every check after setup succeeds, even if an earlier check fails.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          kicad-cli sch erc \
            --severity-error --severity-warning \
            --exit-code-violations \
            --format report \
            --output reports/keyhalld-erc.rpt \
            keyhalld/keyhalld.kicad_sch

      - name: Check PCB (DRC and schematic parity) Main
        # Run DRC even if ERC found violations, but only after setup succeeds.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          kicad-cli pcb drc \
            --severity-error --severity-warning \
            --exit-code-violations \
            --schematic-parity \
            --refill-zones \
            --format report \
            --output reports/keyhalld-drc.rpt \
            keyhalld/keyhalld.kicad_pcb

      - name: Check schematic (ERC) Addon
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          kicad-cli sch erc \
            --severity-error --severity-warning \
            --exit-code-violations \
            --format report \
            --output reports/keyhalld-addon-erc.rpt \
            keyhalld-addon/keyhalld-addon.kicad_sch

      - name: Check PCB (DRC and schematic parity) Addon
        # Run DRC even if ERC found violations, but only after setup succeeds.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          kicad-cli pcb drc \
            --severity-error --severity-warning \
            --exit-code-violations \
            --schematic-parity \
            --refill-zones \
            --format report \
            --output reports/keyhalld-addon-drc.rpt \
            keyhalld-addon/keyhalld-addon.kicad_pcb

      - name: Print check reports
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          shopt -s nullglob
          for report in reports/*.rpt; do
            printf '::group::%s\n' "$report"
            cat "$report"
            printf '\n::endgroup::\n'
          done

      - name: Upload check reports
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: kicad-check-reports
          path: reports/*.rpt
          if-no-files-found: warn
          retention-days: 14

      - name: Export Main PCB STEP model
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          mkdir -p models
          # Omit soldermask faces so the exported copper remains visible.
          kicad-cli pcb export step \
            --subst-models \
            --include-silkscreen \
            --include-tracks --include-pads --include-zones \
            --output models/keyhalld.step \
            keyhalld/keyhalld.kicad_pcb

      - name: Export Addon PCB STEP model
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          mkdir -p models
          kicad-cli pcb export step \
            --subst-models \
            --include-silkscreen \
            --include-tracks --include-pads --include-zones \
            --output models/keyhalld-addon.step \
            keyhalld-addon/keyhalld-addon.kicad_pcb

      - name: Upload PCB STEP models
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: kicad-pcb-step-models
          path: models/*.step
          if-no-files-found: error
          retention-days: 14

      - name: Export Main copper layers and dimensions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          /usr/bin/python3 .github/scripts/export-pcb-docs.py \
            keyhalld/keyhalld.kicad_pcb pcb-docs

      - name: Export Addon copper layers and dimensions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          /usr/bin/python3 .github/scripts/export-pcb-docs.py \
            keyhalld-addon/keyhalld-addon.kicad_pcb pcb-docs

      - name: Upload copper layers and dimensions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: kicad-pcb-copper-and-dimensions
          path: pcb-docs/
          if-no-files-found: error
          retention-days: 14
